name: build

# Builds the runtime images from gpu/ and publishes them to GHCR (and to Docker Hub when its secrets are set).
# A tag is never overwritten: the version comes from the VERSION file, and a run stops if the tag already exists.
on:
  push:
    branches: [main]
    paths: [VERSION, "gpu/**", "scripts/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      max-parallel: 1
      matrix:
        include:
          - target: runtime
            suffix: ""
          - target: runtime-lora
            suffix: "-runtime-lora"
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/gpu-runtime
      DOCKERHUB_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/oneart-gpu
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af >/dev/null
          df -h /

      - name: Versions
        id: v
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          agent="$(sed -n 's/^AGENT_VERSION = "\(.*\)"$/\1/p' gpu/remote/agent.py)"
          [ -n "$version" ] && [ -n "$agent" ] || { echo "VERSION or AGENT_VERSION missing" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "agent=$agent" >> "$GITHUB_OUTPUT"
          echo "tag=${version}${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Refuse to overwrite an existing tag
        run: |
          if docker manifest inspect "$GHCR_IMAGE:${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "$GHCR_IMAGE:${{ steps.v.outputs.tag }} already exists; bump VERSION" >&2; exit 1
          fi

      - name: Build
        run: |
          docker build -f gpu/image/Dockerfile --target "${{ matrix.target }}" \
            --build-arg "IMAGE_VERSION=${{ steps.v.outputs.version }}" --build-arg "AGENT_VERSION=${{ steps.v.outputs.agent }}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "local:${{ steps.v.outputs.tag }}" gpu
          docker image inspect --format 'size {{.Size}}' "local:${{ steps.v.outputs.tag }}"

      - name: Secret scan
        run: |
          img="local:${{ steps.v.outputs.tag }}"
          docker history --no-trunc --format '{{.CreatedBy}}' "$img" | bash scripts/gpu-image-scan.sh -
          values="$(bash scripts/gpu-image-scan.sh --value-pattern)"
          found="$(docker run --rm --entrypoint bash "$img" -c "grep -rIlE '$values' /opt/oneart /etc /root /workspace 2>/dev/null | grep -v '/site-packages/' || true")"
          [ -z "$found" ] || { echo "secret-looking string in: $found" >&2; exit 1; }

      - name: No model weights
        run: |
          found="$(docker run --rm --entrypoint bash "local:${{ steps.v.outputs.tag }}" -c "find / -xdev -not -path '/proc/*' -size +100M \( -name '*.safetensors' -o -name '*.ckpt' -o -name '*.gguf' -o -name '*.pth' \) 2>/dev/null")"
          [ -z "$found" ] || { echo "weight files in the image: $found" >&2; exit 1; }

      - name: Smoke (selfcheck, validate, dry run)
        run: docker run --rm --entrypoint bash "local:${{ steps.v.outputs.tag }}" /opt/oneart/bin/smoke.sh

      - name: Push to GHCR
        run: |
          docker tag "local:${{ steps.v.outputs.tag }}" "$GHCR_IMAGE:${{ steps.v.outputs.tag }}"
          docker push "$GHCR_IMAGE:${{ steps.v.outputs.tag }}"
          echo "image_ref $(docker image inspect --format '{{index .RepoDigests 0}}' "$GHCR_IMAGE:${{ steps.v.outputs.tag }}")" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Push to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          if docker manifest inspect "$DOCKERHUB_IMAGE:${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "Docker Hub already has ${{ steps.v.outputs.tag }}; skipped"; exit 0
          fi
          docker tag "local:${{ steps.v.outputs.tag }}" "$DOCKERHUB_IMAGE:${{ steps.v.outputs.tag }}"
          docker push "$DOCKERHUB_IMAGE:${{ steps.v.outputs.tag }}"
          echo "dockerhub $(docker image inspect --format '{{index .RepoDigests 1}}' "$DOCKERHUB_IMAGE:${{ steps.v.outputs.tag }}")" | tee -a "$GITHUB_STEP_SUMMARY"
